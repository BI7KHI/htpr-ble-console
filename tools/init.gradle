// Gradle 全局仓库镜像重写 —— 面向中国大陆网络
//
// 安装（二选一）：
//   cp tools/init.gradle ~/.gradle/init.gradle
//   Windows: copy tools\init.gradle %USERPROFILE%\.gradle\init.gradle
//
// 背景：以下主机在大陆网络下不可达或极慢，会表现为「Gradle 卡住不动」：
//   maven.google.com / dl.google.com / repo1.maven.org / plugins.gradle.org
//   storage.googleapis.com/download.flutter.io   （Flutter 引擎 AAR）
//   services.gradle.org                          （Gradle 发行包）
//
// 本脚本在 settings / project 两级把仓库重写到阿里云与 Flutter 中国官方镜像。
// 另外建议在 ~/.gradle/gradle.properties 中加入连接超时，避免在死主机上干等：
//   systemProp.org.gradle.internal.http.connectionTimeout=15000
//   systemProp.org.gradle.internal.http.socketTimeout=30000

def aliPublic  = 'https://maven.aliyun.com/repository/public'
def aliGoogle  = 'https://maven.aliyun.com/repository/google'
def aliPlugin  = 'https://maven.aliyun.com/repository/gradle-plugin'
def aliCentral = 'https://maven.aliyun.com/repository/central'
def flCnMaven  = 'https://storage.flutter-io.cn/download.flutter.io'

def rewrite = { repos ->
    try {
        repos.all { repo ->
            def u = ''
            try { u = repo.url.toString() } catch (e) { return }
            if (u.contains('download.flutter.io')) {
                // Flutter 引擎 AAR：storage.googleapis.com -> storage.flutter-io.cn
                repo.setUrl(flCnMaven)
            } else if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                repo.setUrl(aliCentral)
            } else if (u.contains('dl.google.com') || u.contains('maven.google.com')) {
                repo.setUrl(aliGoogle)
            } else if (u.contains('plugins.gradle.org')) {
                repo.setUrl(aliPlugin)
            }
        }
    } catch (e) { }
}

def addMirrors = { repos ->
    try {
        repos.maven { url aliPublic }
        repos.maven { url aliGoogle }
        repos.maven { url aliPlugin }
        repos.maven { url aliCentral }
        repos.maven { url flCnMaven }
    } catch (e) { }
}

settingsEvaluated { settings ->
    try { rewrite(settings.pluginManagement.repositories) } catch (e) {}
    try { rewrite(settings.dependencyResolutionManagement.repositories) } catch (e) {}
    try { addMirrors(settings.pluginManagement.repositories) } catch (e) {}
    try { addMirrors(settings.dependencyResolutionManagement.repositories) } catch (e) {}
}

allprojects { p ->
    buildscript { rewrite(repositories); addMirrors(repositories) }
    rewrite(repositories); addMirrors(repositories)
}
